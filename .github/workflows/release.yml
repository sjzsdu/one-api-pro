name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0). Leave empty to use the pushed tag."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # go.mod 声明 go 1.25.0；固定为 1.25 避免 CI 依赖 GOTOOLCHAIN=auto
          # 现场下载工具链（下载失败会让整个 v* tag 的 Release 直接失败）。
          # go.mod requires 1.25.0; pin it so the job never depends on a
          # runtime toolchain download for a tagged release.
          go-version: "1.25"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        run: |
          cd web
          sh build.sh
          cd ..

      - name: Build binaries
        run: |
          LDFLAGS="-s -w -X github.com/modelbus/one-api-pro/common.Version=${TAG}"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/one-api-pro-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/one-api-pro-linux-arm64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/one-api-pro-windows-amd64.exe .
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/one-api-pro-darwin-amd64 .
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/one-api-pro-darwin-arm64 .

      - name: Normalize tag (auto-prefix v)
        id: tag
        run: |
          raw="${{ env.TAG }}"
          case "$raw" in
            v*) normalized="$raw" ;;
            *)   normalized="v$raw" ;;
          esac
          if [ -z "$raw" ]; then
            echo "::error::Tag is empty. Pass a tag via push (v*) or workflow_dispatch input."
            exit 1
          fi
          if ! [[ "$normalized" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "::error::Tag '$raw' (normalized to '$normalized') does not look like a semver tag (vX.Y.Z)."
            exit 1
          fi
          echo "normalized=$normalized" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $normalized"

      # CHANGELOG 只作为可选的 Release notes 来源，不再是发布硬门槛；
      # 缺失时生成占位说明，保证任何 v* tag 都能正常发版。
      # CHANGELOG is an optional source of release notes, not a hard gate;
      # a placeholder is used when missing so any v* tag can be released.
      - name: Prepare release notes
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.normalized }}
        run: |
          SRC="CHANGELOG/${TAG}.md"
          if [ -f "$SRC" ]; then
            echo "path=$SRC" >> "$GITHUB_OUTPUT"
            echo "Using $SRC as release notes."
          else
            echo "path=dist/RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"
            mkdir -p dist
            printf 'Release %s\n\nNo CHANGELOG/%s.md found; see the commit history for changes.\n' "$TAG" "$TAG" > dist/RELEASE_NOTES.md
            echo "::warning::CHANGELOG/${TAG}.md not found; using placeholder release notes."
          fi

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.normalized }}
          name: ${{ steps.tag.outputs.normalized }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/one-api-pro-linux-amd64
            dist/one-api-pro-linux-arm64
            dist/one-api-pro-windows-amd64.exe
            dist/one-api-pro-darwin-amd64
            dist/one-api-pro-darwin-arm64
