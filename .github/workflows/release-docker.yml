name: release-docker

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0). Leave empty to use the pushed tag."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  # 部署仓库 deploy 的硬规范：只使用 Docker Hub 账号 sjzsdu/*，
  # 国内服务器只配了 Docker Hub 加速器，GHCR 仅作为备份来源保留。
  # deploy repo convention: publish to sjzsdu/* on Docker Hub; GHCR stays as a backup.
  DOCKERHUB_IMAGE: sjzsdu/one-api-pro
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build-and-push:
    name: Build & push multi-arch Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize tag (auto-prefix v)
        id: tag
        run: |
          raw="${{ env.TAG }}"
          case "$raw" in
            v*) normalized="$raw" ;;
            *)   normalized="v$raw" ;;
          esac
          if [ -z "$raw" ]; then
            echo "::error::Tag is empty. Pass a tag via push (v*) or workflow_dispatch input."
            exit 1
          fi
          if ! [[ "$normalized" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "::error::Tag '$raw' (normalized to '$normalized') does not look like a semver tag (vX.Y.Z)."
            exit 1
          fi
          echo "normalized=$normalized" >> "$GITHUB_OUTPUT"
          echo "Release tag: $normalized"

      - name: Verify CHANGELOG exists
        env:
          TAG: ${{ steps.tag.outputs.normalized }}
        run: |
          SRC="CHANGELOG/${TAG}.md"
          if [ ! -f "$SRC" ]; then
            echo "::error::CHANGELOG file not found: $SRC"
            echo "Every released tag must have a matching CHANGELOG/<tag>.md before tagging."
            exit 1
          fi

      # 双推是硬要求：缺少 Docker Hub 凭据时直接失败，绝不静默退回只推 GHCR。
      # Dual-push is mandatory. Never silently degrade to a GHCR-only push.
      - name: Verify Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets are not configured on this repository."
            echo "Configure both secrets (use a Docker Hub Access Token, not the account password), then re-run."
            echo "Refusing to fall back to a GHCR-only push."
            exit 1
          fi
          echo "Docker Hub credentials present for user ${DOCKERHUB_USERNAME}."

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 一个 metadata 步骤同时为两个 registry 生成同构 tags。
          # One metadata step generates identical tag sets for both registries.
          images: |
            ${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_IMAGE }}
          # latest=auto：仅当 tag 不含预发布后缀（-rc/-alpha/-beta 等）时打 latest
          # semver 规则输出的是不带 v 的 0.0.28；部署侧固定使用带 v 的 v0.0.28，
          # 因此额外用 type=raw 保留一个与 git tag 同名的镜像 tag。
          # semver rules emit 0.0.28 without the v prefix; deploy uses the
          # v-prefixed tag, so type=raw keeps an image tag matching the git tag.
          flavor: latest=auto
          tags: |
            type=raw,value=${{ steps.tag.outputs.normalized }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=one-api-pro
            org.opencontainers.image.description=One API Pro - OpenAI API management & relay
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      # 预构建 web/build 在 amd64 原生 runner 上跑 npm install;避免在 arm64
      # emulated 下跑 Node 触发 Illegal instruction(SIGILL, 退出码 132)。
      # web/build 在 GitHub Actions cache 里跨 workflow 复用,命中时直接 skip。
      # Pre-build web/build on the native amd64 runner. This avoids running
      # npm install under QEMU-arm64 emulation, which causes SIGILL (exit 132)
      # because V8's generated atomics aren't translated by qemu-user-static.
      # Cross-workflow caching in GHA skips rebuilds on lockfile hit.
      # 版本: v0.0.16
      - name: Set up Node.js (for pre-building web/default-pro)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore web/build cache
        id: web-build-cache
        uses: actions/cache/restore@v4
        with:
          path: web/build
          key: web-build-${{ runner.os }}-${{ hashFiles('web/default-pro/package-lock.json', 'web/default-pro/pnpm-lock.yaml', 'web/default-pro/vite.config.js') }}
          restore-keys: |
            web-build-${{ runner.os }}-

      - name: Pre-build web/default-pro
        if: steps.web-build-cache.outputs.cache-hit != 'true'
        working-directory: web/default-pro
        run: |
          npm ci
          npm run build

      - name: Save web/build cache
        if: steps.web-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: web/build
          key: web-build-${{ runner.os }}-${{ hashFiles('web/default-pro/package-lock.json', 'web/default-pro/pnpm-lock.yaml', 'web/default-pro/vite.config.js') }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.tag.outputs.normalized }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          PKG_NAME=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          OWNER_TYPE=$(gh api "/repos/${OWNER}/${REPO}" --jq '.owner.type')
          case "$OWNER_TYPE" in
            User)         ENDPOINT="/users/${OWNER}/packages/container/${PKG_NAME}" ;;
            Organization) ENDPOINT="/orgs/${OWNER}/packages/container/${PKG_NAME}" ;;
            *)            echo "::warning::Unknown owner type '$OWNER_TYPE', skip."; exit 0 ;;
          esac
          echo "Setting ${ENDPOINT} visibility to public..."
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "${ENDPOINT}" \
            -f visibility=public
